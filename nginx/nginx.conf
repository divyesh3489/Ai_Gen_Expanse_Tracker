server {
  listen 80;
  server_name expansetraker.eliscops.com;

  # Let's Encrypt (certbot) HTTP-01 challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name expansetraker.eliscops.com;

  ssl_certificate /etc/letsencrypt/live/expansetraker.eliscops.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/expansetraker.eliscops.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Avoid stale index.html caching after rebuilds
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Static assets can be cached long-term (Vite uses hashed filenames)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend API proxy (Docker compose service "web")
  location /api/ {
    proxy_pass http://web:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Django admin (and its static assets)
  location /admin/ {
    proxy_pass http://web:8000/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    alias /staticfiles/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}

