# Plain HTTP: the host Apache terminates SSL (certbot) and proxies here on 127.0.0.1:8081
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Avoid stale index.html caching after rebuilds
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Static assets can be cached long-term (Vite uses hashed filenames)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend API proxy (Docker compose service "web")
  location /api/ {
    proxy_pass http://web:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Django admin (and its static assets)
  location /admin/ {
    proxy_pass http://web:8000/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /static/ {
    alias /staticfiles/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # User uploads (profile pictures) stored on the server's disk
  location /media/ {
    alias /media/;
    add_header X-Content-Type-Options "nosniff" always;
  }
}

