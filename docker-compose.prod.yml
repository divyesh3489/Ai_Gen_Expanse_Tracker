services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    # Only reachable from the server; the host Apache proxies the domain here and handles SSL
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - staticfiles:/staticfiles:ro
      - ./ExpanseTraker/media:/media:ro
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./ExpanseTraker:/app
      - staticfiles:/app/staticfiles
    command: >-
      sh -c "python manage.py wait_for_db
      && python manage.py migrate
      && python manage.py collectstatic --noinput
      && gunicorn ExpanseTraker.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      - postgres
      - redis
      - celery
      - celery-beat

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=expanse_tracker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - "5432"

  redis:
    image: redis:latest
    expose:
      - "6379"

  celery:
    build: .
    env_file:
      - .env
    command: celery -A ExpanseTraker worker --loglevel=info
    volumes:
      - ./ExpanseTraker:/app
    depends_on:
      - postgres
      - redis

  celery-beat:
    build: .
    env_file:
      - .env
    command: celery -A ExpanseTraker beat --loglevel=info
    volumes:
      - ./ExpanseTraker:/app
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: {}
  staticfiles: {}

