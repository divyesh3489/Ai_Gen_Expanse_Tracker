# Host Apache site for this project (not used inside Docker).
# Apache already serves the other project on this server and owns ports 80/443.
# Copy to /etc/apache2/sites-available/expanse.shivamcodes.dev.conf,
# enable it, then run: sudo certbot --apache -d expanse.shivamcodes.dev
# certbot creates the 443/SSL copy of this site and adds the HTTP->HTTPS redirect.
# Requires: sudo a2enmod proxy proxy_http headers

<VirtualHost *:80>
    ServerName expanse.shivamcodes.dev

    # 10 MB upload limit (profile pictures)
    LimitRequestBody 10485760

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    # Apache adds X-Forwarded-For itself; REQUEST_SCHEME keeps this correct in certbot's SSL copy
    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
</VirtualHost>
