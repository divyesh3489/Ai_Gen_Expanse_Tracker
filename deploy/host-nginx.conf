# Host nginx site for this project (not used inside Docker).
# Copy to /etc/nginx/sites-available/expanse.shivamcodes.dev,
# enable it, then run: sudo certbot --nginx -d expanse.shivamcodes.dev
# certbot adds the 443/SSL config and the HTTP->HTTPS redirect to this file.

server {
    listen 80;
    server_name expanse.shivamcodes.dev;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
